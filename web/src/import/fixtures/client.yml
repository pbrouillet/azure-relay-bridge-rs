# Synthetic dev-station listeners. These hosts and credentials are deliberately fake.
# Each listener binds the target hostname (mapped locally); the server forwards to that host on 443.
LogLevel: VERBOSE
LocalForward:
  - BindAddress: svc-01.example.test
    BindPort: 44301
    PortName: service-01
    RelayName: example-relay
    ConnectionString: Endpoint=sb://fake-one.example.test/;SharedAccessKeyName=FAKE-CLIENT;SharedAccessKey=NOT-A-REAL-KEY;EntityPath=example-relay
