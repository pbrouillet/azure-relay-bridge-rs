[package]
name = "azbridge-broker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
azbridge-broker-api = { path = "../azbridge-broker-api" }
azbridge-config = { path = "../azbridge-config" }
azure-relay = { path = "../azure-relay", default-features = false }
azure_core = "1.1"
azure_identity = "1.0"
azure_storage_blob = "1.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
serde_ignored = "0.1"
sha2 = { workspace = true }
subtle = "2"
anyhow = "1"
httpdate = "1"
thiserror = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
wiremock = "0.6"
hmac = { workspace = true }
